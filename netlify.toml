# Netlify Configuration for Ajju Juice Wala
# React + Vite + Tailwind CSS + Supabase E-commerce Platform

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application routing rewrite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
